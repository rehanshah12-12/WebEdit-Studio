<style>
@import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@400;500;600;700&display=swap");

:root {
  --ink: #0e0c0a;
  --ink-2: #171411;
  --ink-3: #211c18;
  --cream: #f3eee6;
  --cream-2: #e7dfd2;
  --clay: #b7aea3;
  --stone: #7a7168;
  --ember: #dc6b2f;
  --ember-2: #c25722;
  --wa: #25d366;
  --display: "Fraunces", "Iowan Old Style", Palatino, Georgia, serif;
  --sans: "Outfit", "Segoe UI", system-ui, sans-serif;
  --radius: 1.25rem;
  --max: 70rem;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--sans);
  background: var(--ink);
  color: var(--cream);
  -webkit-font-smoothing: antialiased;
  padding-bottom: 4.5rem;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button, select, input, textarea { font-family: inherit; }
button { cursor: pointer; }
h1, h2, h3 {
  font-family: var(--display);
  font-weight: 560;
  letter-spacing: -0.03em;
  line-height: 1.12;
  text-wrap: balance;
  margin: 0;
}
p { text-wrap: pretty; }
::selection { background: var(--ember); color: var(--cream); }

.wrap { width: min(var(--max), calc(100% - 2rem)); margin-inline: auto; }
.wrap-wide { width: min(76rem, calc(100% - 2rem)); margin-inline: auto; }

/* Header */
.header {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--ink) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgb(243 238 230 / 0.1);
}
.header-inner {
  display: flex; align-items: center; justify-content: space-between;
  height: 4rem; gap: 1rem;
}
.logo { display: flex; align-items: center; gap: 0.65rem; font-family: var(--display); font-weight: 650; font-size: 1.15rem; }
.logo svg { width: 2rem; height: 2rem; }
.nav { display: none; gap: 1.6rem; font-size: 0.92rem; }
.nav a { opacity: 0.62; }
.nav a:hover, .nav a.active { opacity: 1; }
.header-actions { display: none; align-items: center; gap: 0.5rem; }
.icon-wa {
  width: 2.75rem; height: 2.75rem; display: grid; place-items: center;
  background: var(--wa); color: var(--ink); border-radius: 0.7rem;
}
.menu-btn {
  width: 2.75rem; height: 2.75rem; border: 0; background: transparent; color: var(--cream);
}
.mobile-nav {
  display: none; flex-direction: column; padding: 0 1rem 1.25rem;
  border-top: 1px solid rgb(243 238 230 / 0.08);
}
.mobile-nav.open { display: flex; }
.mobile-nav a { min-height: 3rem; display: flex; align-items: center; font-size: 1.05rem; }

@media (min-width: 860px) {
  .nav, .header-actions { display: flex; }
  .menu-btn { display: none; }
  body { padding-bottom: 0; }
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem;
  min-height: 2.75rem; padding: 0 1.2rem; border-radius: 999px; border: 0;
  font-size: 0.92rem; font-weight: 600; transition: background 0.15s var(--ease), transform 0.15s var(--ease);
}
.btn:active { transform: scale(0.98); }
.btn-ember { background: var(--ember); color: var(--cream); }
.btn-ember:hover { background: var(--ember-2); }
.btn-cream { background: var(--cream); color: var(--ink); }
.btn-ghost { background: transparent; color: var(--cream); box-shadow: inset 0 0 0 1px rgb(243 238 230 / 0.18); }
.btn-wa { background: var(--wa); color: var(--ink); }
.btn-ink { background: var(--ink); color: var(--cream); }
.btn-lg { min-height: 3rem; padding: 0 1.4rem; }
.btn-block { width: 100%; }

/* Hero */
.hero {
  position: relative; min-height: 86vh; display: grid; align-items: end;
  overflow: hidden;
}
.hero img.bg {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  outline: none;
}
.hero::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgb(14 12 10 / 0.25) 0%, rgb(14 12 10 / 0.55) 45%, var(--ink) 100%);
}
.hero-copy { position: relative; z-index: 1; padding: 2.5rem 0 3rem; }
.eyebrow { font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ember); margin: 0 0 0.9rem; }
.display { font-size: clamp(2.4rem, 1.1rem + 5vw, 4.6rem); max-width: 14ch; }
.lede { max-width: 36rem; color: var(--clay); font-size: 1.05rem; line-height: 1.6; margin: 1.1rem 0 1.6rem; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; }

.page-hero { padding: 2.5rem 0 1.5rem; }
.page-hero h1 { font-size: clamp(2rem, 1.1rem + 3vw, 3.4rem); max-width: 16ch; }
.page-hero p { max-width: 38rem; color: var(--clay); line-height: 1.6; margin-top: 0.9rem; }

/* Sections */
.section { padding: 3.5rem 0; }
.section-cream { background: var(--cream); color: var(--ink); }
.section-cream .eyebrow { color: var(--ember); }
.section-cream .lede, .section-cream p.muted { color: var(--stone); }
.section-dark { background: var(--ink); }
.section-ink2 { background: var(--ink-2); }
.split { display: grid; gap: 1.5rem; }
@media (min-width: 800px) {
  .split-2 { grid-template-columns: 1fr 1fr; gap: 2rem; align-items: center; }
  .split-text { grid-template-columns: 0.9fr 1.1fr; }
}

.muted { color: var(--clay); line-height: 1.6; }
.section-cream .muted { color: var(--stone); }

/* Cards */
.grid { display: grid; gap: 1rem; }
@media (min-width: 700px) { .grid-3 { grid-template-columns: repeat(3, 1fr); } .grid-2 { grid-template-columns: 1fr 1fr; } }
.card {
  background: var(--ink-2);
  border-radius: var(--radius);
  padding: 1.35rem;
  box-shadow: inset 0 0 0 1px rgb(243 238 230 / 0.1);
}
.card h3 { font-size: 1.35rem; margin: 0.35rem 0 0.5rem; }
.card p { margin: 0; color: var(--clay); line-height: 1.55; font-size: 0.98rem; }
.card-cream {
  background: #fffefb;
  color: var(--ink);
  box-shadow: 0 0 0 1px rgb(14 12 10 / 0.08);
}
.card-cream p { color: var(--stone); }
.card-cream.hot { box-shadow: 0 0 0 1.5px var(--ember); }
.see {
  display: inline-flex; align-items: center; gap: 0.3rem;
  margin-top: 1.1rem; font-size: 0.9rem; font-weight: 600;
}
.icon-mark {
  width: 2.4rem; height: 2.4rem; border-radius: 0.7rem;
  display: grid; place-items: center; background: rgb(220 107 47 / 0.12); color: var(--ember);
}

/* Service paper cards (screenshot 3) */
.paper-card {
  background: #fffefb; color: var(--ink); border-radius: 1.4rem;
  padding: 1.5rem 1.4rem 1.3rem; box-shadow: 0 0 0 1px rgb(14 12 10 / 0.08);
}
.paper-card.hot { box-shadow: 0 0 0 1.5px var(--ember); }
.paper-card h3 { color: var(--ember); font-family: var(--sans); font-weight: 650; letter-spacing: -0.02em; font-size: 1.35rem; }
.paper-card p { color: var(--stone); }

/* Layer cards (screenshot 1) */
.layer {
  background: #fffdf8; color: var(--ink); border-radius: 1.35rem;
  padding: 1.25rem 1.2rem; box-shadow: 0 0 0 1.5px rgb(220 107 47 / 0.45);
  display: grid; grid-template-columns: 1fr auto; gap: 0.75rem; align-items: start;
}
.layer .k { color: var(--ember); font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 650; margin: 0; }
.layer h3 { font-family: var(--sans); font-weight: 700; font-size: 1.28rem; letter-spacing: -0.03em; margin: 0.25rem 0 0.4rem; }
.layer p { color: var(--stone); margin: 0; }
.switch {
  width: 3.1rem; height: 1.7rem; border-radius: 999px; border: 0;
  background: var(--ember); position: relative; flex-shrink: 0; margin-top: 0.4rem;
}
.switch::after {
  content: ""; position: absolute; top: 0.18rem; right: 0.18rem;
  width: 1.32rem; height: 1.32rem; background: #fff; border-radius: 50%;
}
.switch.off { background: var(--cream-2); }
.switch.off::after { right: auto; left: 0.18rem; }

/* Process timeline (screenshot 2) */
.timeline { position: relative; display: grid; gap: 1.25rem; padding-left: 4.4rem; }
.timeline::before {
  content: ""; position: absolute; left: 1.35rem; top: 1.4rem; bottom: 1.4rem;
  width: 1px; background: rgb(220 107 47 / 0.45);
}
.t-item { position: relative; }
.t-num {
  position: absolute; left: -4.4rem; top: 0.9rem;
  width: 3.1rem; height: 3.1rem; border-radius: 50%;
  display: grid; place-items: center;
  border: 1.5px solid var(--ember); color: var(--ember);
  font-family: var(--display); font-size: 1.15rem; background: var(--ink);
  box-shadow: 0 0 0 8px rgb(14 12 10 / 0.9);
}
.t-card {
  background: #161311; border-radius: 1.15rem; padding: 1.25rem 1.2rem 1.15rem;
  box-shadow: inset 0 0 0 1px rgb(243 238 230 / 0.08);
}
.t-card h3 { font-family: var(--sans); font-weight: 650; font-size: 1.2rem; letter-spacing: -0.02em; }
.t-card p { color: var(--clay); margin: 0.55rem 0 0.85rem; line-height: 1.55; }
.t-meta { color: var(--ember); font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 650; }

/* Gear (screenshot 4) */
.gear { background: #120f0d; border-radius: 1.2rem; overflow: hidden; box-shadow: inset 0 0 0 1px rgb(243 238 230 / 0.08); }
.gear-block { padding: 1.5rem 1.35rem; }
.gear-block + .gear-block { border-top: 1px solid rgb(243 238 230 / 0.08); }
.gear h3 { font-family: var(--sans); font-weight: 650; margin: 0.7rem 0 0.35rem; }
.gear p { color: var(--clay); margin: 0 0 0.9rem; }
.dash-list { list-style: none; padding: 0; margin: 0; }
.dash-list li {
  padding: 0.8rem 0; color: var(--cream);
  border-bottom: 1px dashed rgb(243 238 230 / 0.16);
}
.dash-list li:last-child { border-bottom: 0; }

/* Work */
.work-card { display: block; border-radius: 1.2rem; overflow: hidden; background: var(--ink-2); box-shadow: inset 0 0 0 1px rgb(243 238 230 / 0.08); }
.work-card img { width: 100%; height: 14rem; object-fit: cover; }
.work-card .pad { padding: 1.1rem 1.15rem 1.25rem; }
.kicker { font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ember); }
.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.8rem; }
.chip {
  font-size: 0.75rem; padding: 0.28rem 0.6rem; border-radius: 999px;
  box-shadow: inset 0 0 0 1px rgb(243 238 230 / 0.14); color: var(--clay);
}
.section-cream .chip { box-shadow: inset 0 0 0 1px rgb(14 12 10 / 0.12); color: var(--stone); }

/* Checks */
.checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.95rem; }
.checks li { display: flex; gap: 0.7rem; line-height: 1.5; }
.checks svg { flex-shrink: 0; margin-top: 0.15rem; color: var(--ember); }

/* Hours */
.hours { font-size: 0.8rem; letter-spacing: 0.16em; color: rgb(37 99 235 / 0.9); text-transform: uppercase; }
.section-cream .hours { color: #3b6fd8; }

/* Form (screenshot 5) */
.form-shell {
  background: #f7efe6; color: var(--ink); border-radius: 1.6rem; padding: 1.4rem 1.2rem 1.3rem;
}
.field { display: block; margin-bottom: 0.95rem; }
.field span { display: block; font-size: 0.92rem; margin-bottom: 0.4rem; }
.field input, .field select, .field textarea {
  width: 100%; border: 0; background: #fff; color: var(--ink);
  border-radius: 1rem; min-height: 3rem; padding: 0.75rem 1rem; font-size: 1rem;
  box-shadow: 0 0 0 1px rgb(14 12 10 / 0.06);
}
.field textarea { min-height: 8.5rem; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus {
  outline: 2px solid var(--ember); outline-offset: 1px;
}
.form-ok { display: none; background: #fff; border-radius: 1rem; padding: 1rem; margin-bottom: 1rem; }
.form-ok.show { display: block; }

/* Before / after */
.compare { position: relative; border-radius: 1.2rem; overflow: hidden; height: 18rem; }
.compare img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.compare .before { filter: grayscale(0.85) contrast(0.9) saturate(0.35); }
.compare .after { clip-path: inset(0 0 0 50%); }
.compare input[type="range"] {
  position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; z-index: 3;
}
.compare .bar {
  position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: #fff; z-index: 2; pointer-events: none;
}
.tag {
  position: absolute; z-index: 2; top: 0.8rem; background: rgb(14 12 10 / 0.72); color: #fff;
  font-size: 0.75rem; padding: 0.25rem 0.55rem; border-radius: 0.4rem;
}
.tag-l { left: 0.8rem; }
.tag-r { right: 0.8rem; }

/* Preview stack */
.preview {
  position: relative; border-radius: 1.2rem; overflow: hidden; min-height: 16rem;
}
.preview img { width: 100%; height: 18rem; object-fit: cover; }
.preview .cap, .preview .sfx, .preview .grade {
  position: absolute; pointer-events: none; transition: opacity 0.2s var(--ease);
}
.preview .cap {
  left: 8%; right: 8%; bottom: 18%; text-align: center;
  font-family: var(--display); font-size: 1.15rem; text-shadow: 0 2px 16px #000;
}
.preview .sfx {
  left: 1rem; right: 1rem; bottom: 0.8rem; height: 2rem;
  background: linear-gradient(90deg, transparent, var(--ember), transparent);
  opacity: 0.75; filter: blur(0.5px);
}
.preview .grade { inset: 0; background: rgb(220 107 47 / 0.22); mix-blend-mode: overlay; }
.preview.off-hook .cap { opacity: 0; }
.preview.off-sfx .sfx { opacity: 0; }
.preview.off-type .cap { letter-spacing: 0; font-family: var(--sans); font-size: 0.8rem; bottom: 12%; }
.preview.off-grade .grade { opacity: 0; }

/* Footer */
.footer { border-top: 1px solid rgb(243 238 230 / 0.1); padding: 3rem 0 1.2rem; }
.footer-grid { display: grid; gap: 1.5rem; }
@media (min-width: 760px) { .footer-grid { grid-template-columns: 2fr 1fr 1fr; } }
.footer h4 { font-family: var(--sans); font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--stone); margin: 0 0 0.8rem; }
.footer ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.45rem; color: var(--clay); font-size: 0.92rem; }
.legal { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid rgb(243 238 230 / 0.08); color: var(--stone); font-size: 0.78rem; display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; justify-content: space-between; }

/* Float + sticky */
.wa-float {
  position: fixed; right: 1rem; bottom: 5.2rem; z-index: 50;
  width: 3.5rem; height: 3.5rem; border-radius: 50%;
  background: var(--wa); color: var(--ink);
  display: grid; place-items: center;
  box-shadow: 0 10px 28px rgb(37 211 102 / 0.35);
}
@media (min-width: 860px) { .wa-float { bottom: 1.4rem; } }

.sticky-cta {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
  background: var(--ink-2); border-top: 1px solid rgb(243 238 230 / 0.1);
  padding: 0.5rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem;
}
.sticky-cta a {
  min-height: 3rem; display: flex; align-items: center; justify-content: center; gap: 0.4rem;
  border-radius: 0.45rem; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
}
.sticky-cta .consult { background: var(--ember); color: var(--cream); }
.sticky-cta .chat { background: var(--wa); color: var(--ink); }
@media (min-width: 860px) { .sticky-cta { display: none; } }

/* Admin */
.admin-body { background: var(--cream); color: var(--ink); padding-bottom: 0; }
.admin-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.8rem 1rem; background: var(--ink); color: var(--cream);
}
.admin-wrap { width: min(52rem, calc(100% - 2rem)); margin: 1.5rem auto 3rem; }
.login-card, .lead {
  background: #fff; border-radius: 1.1rem; padding: 1.2rem;
  box-shadow: 0 0 0 1px rgb(14 12 10 / 0.08);
}
.lead + .lead { margin-top: 0.8rem; }
.lead header { display: flex; justify-content: space-between; gap: 0.5rem; align-items: start; }
.lead .when { color: var(--stone); font-size: 0.8rem; }
.lead-actions { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.8rem; }
.err { color: #9a2b1f; font-size: 0.88rem; display: none; }
.err.show { display: block; }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; margin-bottom: 1rem; }
.stat { background: #fff; border-radius: 1rem; padding: 0.9rem; box-shadow: 0 0 0 1px rgb(14 12 10 / 0.08); }
.stat b { display: block; font-size: 1.4rem; font-family: var(--display); }

/* Case */
.case-hero img { width: 100%; height: min(28rem, 52vw); object-fit: cover; border-radius: 1.2rem; }
.prose { max-width: 40rem; }
.prose p { line-height: 1.65; color: var(--clay); }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; }
}

/* Single-file SPA: only one HTML file is required. */
.page-view{display:none;}
/* Safe default: show the home page even before JavaScript initializes. */
.page-view#page-home{display:block;}
</style>
</head>

<div id="site-header"></div>
<main id="site-content">
